<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rainbow School</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            text-align: center;
        }
        header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            font-size: 2em;
            font-weight: bold;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
        }
        p {
            margin-bottom: 30px;
        }
        button {
            margin-top: auto;
            margin-bottom: 50px; /* Bottom se thoda upar */
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #3b82f6, #2563eb); /* Nice Blue Gradient */
            color: white;
            cursor: pointer;
            transition: 0.4s ease;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            transform: skewX(-20deg);
            transition: 0.5s;
        }
        button:hover::before {
            left: 130%;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.4);
        }
        button:active {
            transform: translateY(1px);
            box-shadow: 0 6px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<header>Rainbow School</header>

<main>
    <h1>Welcome to Rainbow School</h1>
    <p>Best Education for Your Children</p>
    <button onclick="goToNextPage()">Continue</button>
</main>

<script>
function goToNextPage() {
    window.location.href = "page2.html"; // Ye dusra page open karega
}
</script>

</body>
</html>
